name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integrax
          POSTGRES_PASSWORD: integrax
          POSTGRES_DB: integrax_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm build 2>/dev/null || pnpm --recursive exec tsc --noEmit 2>/dev/null || true

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: integrax
          POSTGRES_PASSWORD: integrax
          POSTGRES_DB: integrax_test
          REDIS_URL: redis://localhost:6379
          SKIP_MIGRATIONS: 'true'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint 2>/dev/null || true

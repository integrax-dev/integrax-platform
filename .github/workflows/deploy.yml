name: Deploy to Production VPS

on:
  workflow_run:
    workflows: ['Build & Push Docker Images']
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/integrax
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose pull control-plane worker

            # Zero-downtime rolling update
            docker compose up -d --no-deps --scale control-plane=2 control-plane
            sleep 15
            docker compose up -d --no-deps --scale control-plane=1 control-plane

            docker compose up -d --no-deps worker
            docker compose restart nginx

            # Clean up old images
            docker image prune -f

            echo "Deploy complete: $(date)"

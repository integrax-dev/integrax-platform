version: '3.9'

# ─── IntegraX Self-Hosted ─────────────────────────────────────────────────────
#
# Stack completo para clientes que hostean IntegraX en su propia infraestructura.
#
# Requisitos:
#   - Docker 24+ y Docker Compose v2
#   - 4 vCPU, 8GB RAM mínimo (recomendado: 8 vCPU, 16GB)
#   - Puerto 80 y 443 abiertos (Nginx maneja SSL)
#
# Setup inicial:
#   1. Copiar .env.example → .env y completar las variables
#   2. docker compose up -d
#   3. docker compose exec control-plane node dist/scripts/migrate.js
#
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-integrax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-integrax}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrax}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [integrax]

  # ── Cache / Queues ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [integrax]

  # ── Control Plane API ────────────────────────────────────────────────────────
  control-plane:
    image: ghcr.io/integrax/control-plane:${INTEGRAX_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV:                   production
      PORT:                       3000
      DATABASE_URL:               postgres://${POSTGRES_USER:-integrax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-integrax}
      DATABASE_SSL:               "false"
      REDIS_URL:                  redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:                 ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY:  ${CREDENTIAL_ENCRYPTION_KEY}
      ANTHROPIC_API_KEY:          ${ANTHROPIC_API_KEY:-}
      SLACK_WEBHOOK_URL:          ${SLACK_WEBHOOK_URL:-}
      # Self-hosted mode: single tenant, no multi-tenancy overhead
      INTEGRAX_MODE:              self_hosted
      INTEGRAX_TENANT_ID:         ${INTEGRAX_TENANT_ID}
      # Telemetría — solo logs/métricas, nunca datos de negocio
      INTEGRAX_TELEMETRY_ENDPOINT: ${INTEGRAX_TELEMETRY_ENDPOINT:-https://telemetry.integrax.io}
      INTEGRAX_TELEMETRY_ENABLED:  ${INTEGRAX_TELEMETRY_ENABLED:-true}
      INTEGRAX_LICENSE_KEY:        ${INTEGRAX_LICENSE_KEY}
    networks: [integrax]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Admin Panel (dashboard del cliente) ──────────────────────────────────────
  admin-panel:
    image: ghcr.io/integrax/admin-panel:${INTEGRAX_VERSION:-latest}
    restart: unless-stopped
    networks: [integrax]

  # ── Worker BullMQ ────────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/integrax/worker:${INTEGRAX_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV:          production
      DATABASE_URL:      postgres://${POSTGRES_USER:-integrax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-integrax}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    networks: [integrax]

  # ── Nginx — reverse proxy + SSL ───────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro          # certificados SSL del cliente
      - nginx_logs:/var/log/nginx
    depends_on:
      - control-plane
      - admin-panel
    networks: [integrax]

  # ── Telemetría (solo logs/métricas — nunca datos de negocio) ─────────────────
  # Agente liviano que reenvía logs estructurados al endpoint de IntegraX.
  # El cliente puede desactivarlo con INTEGRAX_TELEMETRY_ENABLED=false.
  telemetry-agent:
    image: ghcr.io/integrax/telemetry-agent:${INTEGRAX_VERSION:-latest}
    restart: unless-stopped
    depends_on: [control-plane]
    environment:
      INTEGRAX_LICENSE_KEY:        ${INTEGRAX_LICENSE_KEY}
      INTEGRAX_INGEST_URL:         ${INTEGRAX_INGEST_URL:-https://api.integrax.dev/telemetry/ingest}
      INTEGRAX_HEARTBEAT_URL:      ${INTEGRAX_HEARTBEAT_URL:-https://api.integrax.dev/license/heartbeat}
      INTEGRAX_TELEMETRY_ENABLED:  ${INTEGRAX_TELEMETRY_ENABLED:-true}
    # Pipe control-plane logs into the agent for forwarding
    stdin_open: true
    networks: [integrax]

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  integrax:
    driver: bridge

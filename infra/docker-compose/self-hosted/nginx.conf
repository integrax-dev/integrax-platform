# ─── IntegraX Self-Hosted — Nginx ────────────────────────────────────────────

# Redirigir todo HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # SSL — reemplazar con tus certificados
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rate limiting global (complementa el rate limiting del control-plane)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # ── Admin Panel (React SPA) ──────────────────────────────────────────────
    location / {
        proxy_pass http://admin-panel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Control Plane API ────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://control-plane:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para operaciones largas (LLM analysis, etc.)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── SSE streams — sin buffering ──────────────────────────────────────────
    location ~ ^/api/(streams|drift/stream) {
        proxy_pass http://control-plane:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── Health check (público, para monitoreo externo) ───────────────────────
    location /health {
        proxy_pass http://control-plane:3000/health;
        access_log off;
    }
}
